<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Edge-to-Edge Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1533" />
      <stop offset="50%" stop-color="#070f24" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cross Metallic Gold Gradient -->
    <linearGradient id="crossGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Page Inner Warm Illumination -->
    <linearGradient id="pageGlowL" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fefce8" />
      <stop offset="80%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <linearGradient id="pageGlowR" x1="100%" y1="0%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fefce8" />
      <stop offset="80%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Center Radiant Aura -->
    <radialGradient id="centerAura" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#070f24" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>

    <!-- Cross Glow Filter -->
    <filter id="crossGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fbbf24" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Edge-to-Edge Full Bleed Frame -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Center Ambient Radiance -->
  <circle cx="256" cy="220" r="190" fill="url(#centerAura)" />

  <!-- Open Holy Bible Artwork -->
  <g filter="url(#bookShadow)">
    <path d="M 68 376 C 124 394 198 392 256 376 C 314 392 388 394 444 376 C 444 388 388 404 256 388 C 124 404 68 388 68 376 Z" 
          fill="#78350f" />

    <path d="M 72 370 C 126 388 198 386 256 370 C 314 386 386 388 440 370 L 440 378 C 386 396 314 394 256 378 C 198 394 126 396 72 378 Z" 
          fill="url(#goldGrad)" />

    <path d="M 436 360 C 384 374 316 370 258 358 L 258 226 C 316 238 384 242 436 228 Z" 
          fill="#b45309" opacity="0.45" />
    <path d="M 76 360 C 128 374 196 370 254 358 L 254 226 C 196 238 128 242 76 228 Z" 
          fill="#b45309" opacity="0.45" />

    <path d="M 82 350 C 134 362 202 358 254 346 L 254 204 C 202 216 134 220 82 208 Z" 
          fill="url(#pageGlowL)" 
          stroke="url(#goldGrad)" 
          stroke-width="2.5" />

    <path d="M 430 350 C 378 362 310 358 258 346 L 258 204 C 310 216 378 220 430 208 Z" 
          fill="url(#pageGlowR)" 
          stroke="url(#goldGrad)" 
          stroke-width="2.5" />

    <path d="M 238 366 C 248 376 264 376 274 366 L 274 372 C 264 382 248 382 238 372 Z" fill="url(#goldGrad)" />
    <line x1="256" y1="204" x2="256" y2="346" stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Radiant Golden Christian Latin Cross -->
  <g filter="url(#crossGlow)">
    <rect x="248" y="106" width="16" height="110" rx="5" fill="url(#crossGold)" />
    <rect x="224" y="142" width="64" height="16" rx="5" fill="url(#crossGold)" />
    <circle cx="256" cy="150" r="5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Ambient Light Sparks -->
  <g fill="#fde68a" opacity="0.8">
    <circle cx="196" cy="120" r="2.5" />
    <circle cx="316" cy="116" r="3" />
    <circle cx="152" cy="158" r="2" />
    <circle cx="360" cy="154" r="2.5" />
  </g>
</svg>