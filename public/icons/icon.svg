<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Open Bible Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 120)">
    <!-- Book Left Page -->
    <path d="M 150 250 C 100 230 40 235 10 245 L 10 30 C 40 20 100 15 150 35 Z" fill="#faf8f5" stroke="#e2e8f0" stroke-width="3" />
    <!-- Book Right Page -->
    <path d="M 150 250 C 200 230 260 235 290 245 L 290 30 C 260 20 200 15 150 35 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
    
    <!-- Spine -->
    <path d="M 150 35 L 150 250" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Cross in Center Glow -->
    <g transform="translate(150, 110)">
      <line x1="0" y1="-45" x2="0" y2="45" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
      <line x1="-28" y1="-15" x2="28" y2="-15" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- Page Text Lines Representation -->
    <line x1="30" y1="70" x2="120" y2="65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="30" y1="95" x2="120" y2="90" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="30" y1="120" x2="110" y2="115" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <line x1="180" y1="65" x2="270" y2="70" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="180" y1="90" x2="270" y2="95" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <line x1="190" y1="115" x2="270" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>